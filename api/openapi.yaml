openapi: 3.0.3

info:
  title: Campus Events API
  version: 1.0.0
  description: |
    API афиши студенческих мероприятий БГУ (проект «Campus Events», ЛР № 1–4).

    Базовый путь `/api/v1`, формат JSON (UTF-8). Аутентификация — JWT,
    полученный после обмена тикета CAS/LDAP. Роли: `студент`, `организатор`,
    `администратор`; гость работает без токена.

    Коды ошибок отделены от текста: в теле всегда есть машинный `code`
    (`NO_SEATS`, `ALREADY_REGISTERED`, `TICKET_USED`, `OFFER_EXPIRED`,
    `ALREADY_MODERATED`, `VALIDATION_ERROR`), по нему клиент выбирает реакцию.
    Подробности — `docs/06-api.md`.
  contact:
    name: Команда Campus Events
    email: campus-events@bsu.by
  license:
    name: MIT

servers:
  - url: https://api.campus-events.bsu.by/api/v1
    description: Пилотный стенд
  - url: http://localhost:8000/api/v1
    description: Локальный запуск в Docker

tags:
  - name: Каталог
    description: Публичные чтения без аутентификации
  - name: Профиль
    description: Вход через CAS и данные текущего пользователя
  - name: Регистрация
    description: Запись, отмена, лист ожидания
  - name: Билеты
    description: Получение билета и отметка присутствия
  - name: Организатор
    description: Создание мероприятий, участники, отчёты
  - name: Модерация
    description: Очередь заявок и решения администратора
  - name: Администрирование
    description: Клубы и роли

security:
  - bearerAuth: []

paths:
  /events:
    get:
      tags: [Каталог]
      summary: Афиша с фильтрами и постраничной выдачей
      operationId: listEvents
      security: []
      parameters:
        - name: category
          in: query
          description: Код категории
          schema: { type: string, example: it }
        - name: club
          in: query
          description: Идентификатор клуба
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Начало периода (включительно)
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Страница афиши
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EventShort' }
                  total: { type: integer, example: 42 }
                  page: { type: integer, example: 1 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [Организатор]
      summary: Создать мероприятие (черновик)
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
            examples:
              hackathon:
                summary: Хакатон с двумя сессиями
                value:
                  title: Хакатон FPMI-2026
                  description: Сорок восемь часов на прототип учебного сервиса
                  categoryCode: it
                  clubId: a1000000-0000-4000-8000-000000000001
                  publishMode: Свободный
                  sessions:
                    - startsAt: '2026-11-20T18:00:00+03:00'
                      endsAt: '2026-11-20T21:00:00+03:00'
                      building: Главный корпус
                      room: ауд. 721
                      capacity: 60
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '500': { $ref: '#/components/responses/Internal' }

  /events/{id}:
    get:
      tags: [Каталог]
      summary: Карточка мероприятия с сессиями
      operationId: getEvent
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      tags: [Организатор]
      summary: Изменить мероприятие
      description: Доступно владельцу и администратору. Черновик можно менять свободно, опубликованное — только до первой записи.
      operationId: patchEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: If-Match
          in: header
          description: Номер версии, полученный из карточки
          schema: { type: string, example: '3' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
            examples:
              rename:
                summary: Правка названия
                value:
                  title: Хакатон FPMI-2026 (осенний)
                  capacity: 80
      responses:
        '200':
          description: Обновлённое мероприятие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /events/{id}/submit:
    post:
      tags: [Организатор]
      summary: Отправить мероприятие на публикацию
      description: Если режим публикации — «С утверждением», создаётся заявка на модерацию и мероприятие переходит в статус «На модерации». Иначе публикуется сразу.
      operationId: submitEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 300
                  description: Пояснение для модератора
            examples:
              note:
                value:
                  comment: Прошу рассмотреть до пятницы, афиша готова
      responses:
        '200':
          description: Мероприятие отправлено или опубликовано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /events/{id}/report:
    get:
      tags: [Организатор]
      summary: Сводка по мероприятию
      operationId: getEventReport
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
              examples:
                summary:
                  value:
                    registered: 87
                    attended: 71
                    attendanceRate: 0.82
                    cancelled: 12
                    waitlistLength: 5
                    sessions: 2
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search:
    get:
      tags: [Каталог]
      summary: Поиск по названию и описанию
      operationId: search
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, example: волейбол }
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventShort' }
        '422': { $ref: '#/components/responses/Validation' }

  /categories:
    get:
      tags: [Каталог]
      summary: Справочник категорий
      operationId: listCategories
      security: []
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /clubs:
    get:
      tags: [Каталог]
      summary: Список клубов
      operationId: listClubs
      security: []
      responses:
        '200':
          description: Клубы
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Club' }
    post:
      tags: [Администрирование]
      summary: Создать клуб
      operationId: createClub
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClubCreate' }
            examples:
              newClub:
                value:
                  name: Клуб робототехники
                  description: Сборка и программирование учебных роботов
      responses:
        '201':
          description: Клуб создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /clubs/{id}:
    patch:
      tags: [Администрирование]
      summary: Изменить или закрыть клуб
      operationId: patchClub
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClubPatch' }
            examples:
              deactivate:
                value:
                  isActive: false
      responses:
        '200':
          description: Клуб обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/cas/callback:
    post:
      tags: [Профиль]
      summary: Обмен тикета CAS на токен доступа
      description: Единственная точка входа. Пароль не передаётся и не хранится; при первом входе создаётся учётная запись с ролью «Студент».
      operationId: casCallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, service]
              properties:
                ticket:
                  type: string
                  example: ST-1234-abcdef-cas
                service:
                  type: string
                  format: uri
                  example: https://campus-events.bsu.by/auth/callback
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /me:
    get:
      tags: [Профиль]
      summary: Текущий пользователь, его роль и клубы
      operationId: getMe
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/settings:
    get:
      tags: [Профиль]
      summary: Настройки каналов уведомлений
      operationId: getNotificationSettings
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Профиль]
      summary: Изменить каналы уведомлений
      description: Подтверждение записи и приглашение из очереди отключить нельзя — только канал доставки.
      operationId: putNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
            examples:
              emailOnly:
                value:
                  push: false
                  email: true
                  reminders: true
      responses:
        '200':
          description: Настройки сохранены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /users/{id}/role:
    patch:
      tags: [Администрирование]
      summary: Назначить роль пользователю
      description: Изменение попадает в журнал аудита. Отозвать роль у последнего администратора нельзя — 409.
      operationId: patchUserRole
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdate' }
            examples:
              promote:
                value:
                  role: Организатор
                  reason: Избран руководителем клуба программистов
      responses:
        '200':
          description: Роль изменена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /sessions/{sid}/registrations:
    post:
      tags: [Регистрация]
      summary: Записаться на сессию
      description: |
        Основной сценарий записи. Проверки по порядку: сессия существует и открыта,
        дубликата нет, место есть. Если места нет — 409 `NO_SEATS`, и клиент
        предлагает лист ожидания.
      operationId: createRegistration
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationCreate' }
            examples:
              app:
                value:
                  source: Приложение
      responses:
        '201':
          description: Запись создана, билет выдан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /registrations/{id}:
    delete:
      tags: [Регистрация]
      summary: Отменить запись
      description: Освобождает место, билет переводится в статус «Отозван», следующему в очереди уходит предложение места.
      operationId: cancelRegistration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Запись отменена
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{sid}/waitlist:
    post:
      tags: [Регистрация]
      summary: Встать в лист ожидания
      operationId: joinWaitlist
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 200
                  description: Необязательный комментарий для организатора
            examples:
              empty:
                value: {}
      responses:
        '201':
          description: Место в очереди получено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
              examples:
                queued:
                  value:
                    id: e5000000-0000-4000-8000-000000000003
                    status: В листе ожидания
                    waitlistPosition: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /seat-offers/{id}/accept:
    post:
      tags: [Регистрация]
      summary: Принять предложенное место
      description: Предложение живёт 30 минут; после истечения место уходит следующему, повтор даёт 409 `OFFER_EXPIRED`.
      operationId: acceptSeatOffer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmSeatChange:
                  type: boolean
                  description: Подтверждение, если место в другом зале
                  default: true
            examples:
              accept:
                value:
                  confirmSeatChange: true
      responses:
        '200':
          description: Запись переведена в статус «Записан», билет выдан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets:
    get:
      tags: [Билеты]
      summary: Мои билеты
      operationId: listTickets
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Действителен, Использован, Отозван]
      responses:
        '200':
          description: Билеты пользователя
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{id}:
    get:
      tags: [Билеты]
      summary: Билет с данными для QR
      description: Содержит подписанную строку, но не содержит персональных данных. Доступен без сети 7 дней в приложении.
      operationId: getTicket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Билет
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{id}/check-in:
    post:
      tags: [Билеты]
      summary: Отметить присутствие по билету
      operationId: checkInTicket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInRequest' }
            examples:
              scan:
                value:
                  qrPayload: e5000000-0000-4000-8000-000000000001|c3000000-0000-4000-8000-000000000001|2026-10-21T10:00:00Z
                  scannedAt: '2026-11-20T18:05:00+03:00'
                  deviceId: tablet-gate-2
      responses:
        '200':
          description: Отметка принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /checkins/batch:
    post:
      tags: [Билеты]
      summary: Пакетная отметка после работы без сети
      description: "Принимает накопленную офлайн-очередь. Идемпотентно по `qrPayload`: повторная отметка не создаёт дубль и не перезаписывает время."
      operationId: checkInBatch
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchCheckInRequest' }
            examples:
              offlineQueue:
                value:
                  deviceId: tablet-gate-2
                  items:
                    - qrPayload: e5000000-0000-4000-8000-000000000001|c3000000-0000-4000-8000-000000000001|2026-10-21T10:00:00Z
                      scannedAt: '2026-11-20T18:05:00+03:00'
                    - qrPayload: e5000000-0000-4000-8000-000000000002|c3000000-0000-4000-8000-000000000001|2026-10-22T12:30:00Z
                      scannedAt: '2026-11-20T18:07:00+03:00'
      responses:
        '200':
          description: Результат по каждому элементу
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer, example: 1 }
                  alreadyMarked: { type: integer, example: 1 }
                  failed:
                    type: array
                    items: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /sessions/{sid}/participants:
    get:
      tags: [Организатор]
      summary: Список участников сессии
      operationId: listParticipants
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: q
          in: query
          description: Поиск по ФИО и группе
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [Записан, Посетил, Неявка, Отменено, В листе ожидания]
      responses:
        '200':
          description: Участники
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Participant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{sid}/export:
    get:
      tags: [Организатор]
      summary: Выгрузка списка участников
      description: CSV (UTF-8 с BOM для Excel) или XLSX. Контактных данных в выгрузке нет.
      operationId: exportParticipants
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
      responses:
        '200':
          description: Файл
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reviews:
    post:
      tags: [Регистрация]
      summary: Оставить отзыв о посещённом мероприятии
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
            examples:
              good:
                value:
                  eventId: b2000000-0000-4000-8000-000000000003
                  rating: 5
                  text: Хорошая организация, судейство по правилам
      responses:
        '201':
          description: Отзыв создан и отправлен на проверку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /moderation/requests:
    get:
      tags: [Модерация]
      summary: Очередь заявок на модерацию
      operationId: listModerationRequests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [На рассмотрении, Утверждено, Возвращено]
            default: На рассмотрении
      responses:
        '200':
          description: Заявки, отсортированные по сроку рассмотрения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModerationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /moderation/requests/{id}/decision:
    post:
      tags: [Модерация]
      summary: Принять решение по заявке
      description: Возврат требует комментария не короче 10 символов. Решение неизменяемо; повторный вызов даёт 409 `ALREADY_MODERATED`.
      operationId: decideModerationRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionCreate' }
            examples:
              approve:
                value:
                  type: Утвердить
                  comment: Опубликовано без замечаний, афиша загружена
              return:
                value:
                  type: Вернуть
                  comment: На афише нечитаемый текст, замените изображение
      responses:
        '201':
          description: Решение зафиксировано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Комментарий обязателен при возврате и должен быть не короче 10 символов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                commentShort:
                  value:
                    code: COMMENT_TOO_SHORT
                    message: Комментарий при возврате должен быть не короче 10 символов
                    field: comment
                    traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f606

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен, полученный в `POST /auth/cas/callback`, срок жизни 30 дней

  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: Идентификатор мероприятия
      schema: { type: string, format: uuid }
    SessionId:
      name: sid
      in: path
      required: true
      description: Идентификатор сессии
      schema: { type: string, format: uuid }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, UNAUTHENTICATED, TOKEN_EXPIRED, FORBIDDEN, NOT_OWNER,
                 ROLE_REQUIRED, NOT_FOUND, NO_SEATS, ALREADY_REGISTERED, TICKET_USED,
                 OFFER_EXPIRED, ALREADY_MODERATED, VALIDATION_ERROR, TITLE_TOO_SHORT,
                 SESSION_IN_PAST, COMMENT_TOO_SHORT, RATE_LIMITED, INTERNAL]
        message:
          type: string
          description: Текст для пользователя, на русском
          example: Свободных мест нет. Можно встать в лист ожидания.
        field:
          type: string
          nullable: true
          description: Поле, из-за которого ошибка, для подсветки в форме
          example: comment
        traceId:
          type: string
          format: uuid

    EventShort:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: Хакатон FPMI-2026 }
        categoryCode: { type: string, example: it }
        posterUrl: { type: string, nullable: true }
        nearestStartsAt: { type: string, format: date-time }
        freeSeats: { type: integer, example: 12 }
        status: { $ref: '#/components/schemas/EventStatus' }

    EventStatus:
      type: string
      enum: [Черновик, На модерации, Опубликовано, Отклонено, Отменено, Завершено]

    Event:
      allOf:
        - $ref: '#/components/schemas/EventShort'
        - type: object
          properties:
            description: { type: string }
            clubId: { type: string, format: uuid }
            publishMode:
              type: string
              enum: [Свободный, С утверждением]
            capacity: { type: integer, nullable: true }
            version: { type: integer, description: Номер версии для If-Match }
            sessions:
              type: array
              items: { $ref: '#/components/schemas/Session' }
            createdAt: { type: string, format: date-time }
            publishedAt: { type: string, format: date-time, nullable: true }

    EventCreate:
      type: object
      required: [title, categoryCode, clubId, sessions]
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        posterUrl: { type: string, maxLength: 255 }
        categoryCode: { type: string }
        clubId: { type: string, format: uuid }
        publishMode:
          type: string
          enum: [Свободный, С утверждением]
          default: Свободный
        sessions:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/SessionCreate' }

    EventPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        posterUrl: { type: string, maxLength: 255 }
        categoryCode: { type: string }
        capacity: { type: integer, minimum: 1, nullable: true }
        publishMode:
          type: string
          enum: [Свободный, С утверждением]

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        building: { type: string }
        room: { type: string, nullable: true }
        capacity: { type: integer }
        taken: { type: integer }
        freeSeats: { type: integer }

    SessionCreate:
      type: object
      required: [startsAt, endsAt, building, capacity]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        building: { type: string, maxLength: 120 }
        room: { type: string, maxLength: 60 }
        capacity: { type: integer, minimum: 1 }

    RegistrationCreate:
      type: object
      properties:
        source:
          type: string
          enum: [Приложение, Веб, Регистрация на месте]
          default: Приложение

    Registration:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status:
          type: string
          enum: [Записан, В листе ожидания, Отменено, Посетил, Неявка]
        waitlistPosition: { type: integer, nullable: true }
        source:
          type: string
          enum: [Приложение, Веб, Регистрация на месте]
        ticket: { $ref: '#/components/schemas/Ticket' }
        createdAt: { type: string, format: date-time }
        attendedAt: { type: string, format: date-time, nullable: true }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        qrPayload:
          type: string
          description: Строка для QR, подписана Ed25519
          example: e5000000-0000-4000-8000-000000000001|c3000000-0000-4000-8000-000000000001|2026-10-21T10:00:00Z
        status:
          type: string
          enum: [Действителен, Использован, Отозван]
        issuedAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }

    CheckInRequest:
      type: object
      required: [qrPayload, scannedAt]
      properties:
        qrPayload: { type: string, maxLength: 300 }
        scannedAt: { type: string, format: date-time }
        deviceId: { type: string, maxLength: 64 }

    CheckInResult:
      type: object
      properties:
        ticketId: { type: string, format: uuid }
        alreadyMarked: { type: boolean }
        participantName: { type: string, example: Иванов Иван Иванович }
        sessionId: { type: string, format: uuid }
        markedAt: { type: string, format: date-time }

    BatchCheckInRequest:
      type: object
      required: [items]
      properties:
        deviceId: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/CheckInRequest' }

    Participant:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        fullName: { type: string }
        studyGroup: { type: string, nullable: true }
        status:
          type: string
          enum: [Записан, В листе ожидания, Отменено, Посетил, Неявка]
        attendedAt: { type: string, format: date-time, nullable: true }

    ReviewCreate:
      type: object
      required: [eventId, rating]
      properties:
        eventId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 2000 }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        rating: { type: integer }
        text: { type: string, nullable: true }
        status:
          type: string
          enum: [На проверке, Опубликован, Скрыт]
        createdAt: { type: string, format: date-time }

    Category:
      type: object
      properties:
        code: { type: string, example: it }
        name: { type: string, example: Информационные технологии }
        sortOrder: { type: integer, example: 1 }

    Club:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }

    ClubCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        logoUrl: { type: string, maxLength: 255 }

    ClubPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, nullable: true }
        isActive: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email, nullable: true }
        faculty: { type: string, nullable: true }
        studyGroup: { type: string, nullable: true }
        role:
          type: string
          enum: [Гость, Студент, Организатор, Администратор]
        clubs:
          type: array
          items:
            type: object
            properties:
              clubId: { type: string, format: uuid }
              name: { type: string }
              position:
                type: string
                enum: [Руководитель, Заместитель, Член]

    RoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [Гость, Студент, Организатор, Администратор]
        reason: { type: string, minLength: 5, maxLength: 300 }

    NotificationSettings:
      type: object
      properties:
        push: { type: boolean, example: true }
        email: { type: boolean, example: true }
        reminders:
          type: boolean
          description: Напоминания за 24 и 2 часа; отключение не затрагивает подтверждение записи
          example: true

    ModerationRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventTitle: { type: string }
        version: { type: integer }
        submittedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        status:
          type: string
          enum: [На рассмотрении, Утверждено, Возвращено]

    DecisionCreate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [Утвердить, Вернуть]
        comment:
          type: string
          minLength: 10
          maxLength: 1000
          description: Обязателен при возврате

    Decision:
      type: object
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        type:
          type: string
          enum: [Утвердить, Вернуть]
        comment: { type: string, nullable: true }
        adminId: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }

    Report:
      type: object
      properties:
        registered: { type: integer, example: 87 }
        attended: { type: integer, example: 71 }
        attendanceRate: { type: number, format: float, example: 0.82 }
        cancelled: { type: integer, example: 12 }
        waitlistLength: { type: integer, example: 5 }
        sessions: { type: integer, example: 2 }

  responses:
    Unauthorized:
      description: Нет токена или истёк срок
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            expired:
              value:
                code: TOKEN_EXPIRED
                message: Сессия истекла, войдите через CAS заново
                field: null
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f601
    Forbidden:
      description: Нет прав на объект
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notOwner:
              value:
                code: NOT_OWNER
                message: Мероприятие принадлежит другому организатору
                field: null
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f602
    NotFound:
      description: Объект не найден или скрыт от этой роли
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing:
              value:
                code: NOT_FOUND
                message: Мероприятие не найдено
                field: null
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f603
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            noSeats:
              value:
                code: NO_SEATS
                message: Свободных мест нет. Можно встать в лист ожидания.
                field: null
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f604
            alreadyRegistered:
              value:
                code: ALREADY_REGISTERED
                message: Вы уже записаны на эту сессию
                field: null
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f605
    Validation:
      description: Ошибка валидации полей
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidField:
              value:
                code: VALIDATION_FAILED
                message: Поле не прошло проверку формата или ограничения
                field: title
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f606
    TooManyRequests:
      description: Превышен лимит запросов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            limited:
              value:
                code: RATE_LIMITED
                message: Слишком много запросов, попробуйте через минуту
                field: null
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f607
    Internal:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            crash:
              value:
                code: INTERNAL
                message: Внутренняя ошибка, попробуйте позже
                field: null
                traceId: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f608
