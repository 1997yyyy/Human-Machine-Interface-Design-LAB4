# PostgreSQL для ЛР № 4: схема и демонстрационные данные применяются при первом старте.
# Запуск:  docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-events-db
    environment:
      POSTGRES_DB: campus_events
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - campus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_events"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campus_pgdata:
